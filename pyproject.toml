[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autokdewallet"
description = "Unlock KDE Wallet automatically with TPM-backed systemd credentials"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = []

[project.scripts]
autokdewallet = "autokdewallet.unlock:main"

[tool.setuptools.dynamic]
version = { attr = "autokdewallet.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
